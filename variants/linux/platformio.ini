[env:linux]
extends = linux_base
; Companion-radio role. Transport: ArduinoSerialInterface(Serial), which
; ArduLinux maps to stdin/stdout. Pipe binary control frames in/out, or
; bridge via socat / a future TCP/BLE wrapper.
build_flags =
  ${linux_base.build_flags}
  -D RADIO_CLASS=LinuxSX1262
  -D WRAPPER_CLASS=LinuxSX1262Wrapper
  -D USE_CUSTOM_SX1262_WRAPPER
  -D SKIP_CONFIG_OVERWRITE=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D LORA_TX_POWER=22
  !pkg-config --cflags --libs libbsd-overlay --silence-errors || :

build_src_filter = ${linux_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>

lib_deps =
  ${linux_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:linux_repeater]
extends = linux_base
build_flags =
  ${linux_base.build_flags}
  -D RADIO_CLASS=LinuxSX1262
  -D WRAPPER_CLASS=LinuxSX1262Wrapper
  -D USE_CUSTOM_SX1262_WRAPPER
  -D SKIP_CONFIG_OVERWRITE=1
  -D MAX_NEIGHBOURS=100
  -D LORA_TX_POWER=22
  -D MESH_DEBUG=1

build_src_filter = ${linux_base.build_src_filter}
  +<../examples/simple_repeater>

lib_deps =
  ${linux_base.lib_deps}
