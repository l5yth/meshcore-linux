advert_name = Sample Router
admin_password = password
lat = 0.0
lon = 0.0

# Local CLI console. Connect with `meshcore-cli -r -s <path>`. Leave unset for a
# per-user default ($XDG_RUNTIME_DIR/meshcore/console, else
# /tmp/meshcore-<uid>/console). Under the systemd unit, uncomment the /run path
# below (its RuntimeDirectory provides and cleans up that directory). The console
# is owner-only (mode 0600) and grants the privileged, unauthenticated CLI.
#console_path = /run/meshcored/console

# Waveshare LoRa hat
#lora_irq_pin = 16
#lora_reset_pin = 18
#lora_nss_pin = 21
#lora_busy_pin = 20

lora_irq_pin = 22
lora_reset_pin = 13
#lora_nss_pin = # SS pin handled by RPI
#lora_busy_pin = # Seems to be unused?
#lora_rxen_pin
#lora_txen_pin

spidev = /dev/spidev0.0
# lora_gpiochip = gpiochip0          # Pi 3/4/Zero 2W default; Pi 5 may need gpiochip4 or pinctrl-rp1
# companion_tcp_port = 5000          # linux env only; 0 = stdin/stdout fallback
# companion_tcp_bind = 127.0.0.1     # 0.0.0.0 to expose on the network (no auth!)
lora_freq = 869.618
lora_bw = 62.5
lora_sf = 8
lora_cr = 8
lora_tcxo = 1.8
