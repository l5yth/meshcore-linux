# ========== MQTT Bridge Configuration ==========
# Enable MQTT bidirectional bridge for mesh message routing
# Messages can be queued by apps and forwarded through mesh network

[mqtt]
# Enable/disable MQTT support
enabled = true

# MQTT broker settings
broker = localhost
port = 1883
client_id = meshcore-node-1

# Optional authentication
#username = mqtt_user
#password = mqtt_pass

# Queue sizes (max messages pending)
outbound_queue_size = 50
inbound_queue_size = 50

# Message time-to-live in seconds
message_ttl_seconds = 3600

# TLS/SSL settings
use_tls = false
#tls_ca_file = /etc/meshcore/ca.crt

# MQTT keepalive interval (seconds)
keepalive_seconds = 60

# Clean session on connect
clean_session = true

# ===== Hash Routes =====
# Map mesh hash addresses to MQTT topics
# Format: hash_<size>_<hex> = topic[:direction]
# 
# <size>: 1, 2, or 3 (bytes)
# <hex>: Hexadecimal hash value
#   1 byte:  ff, 01, 80
#   2 bytes: abcd, 1234, ffff
#   3 bytes: 123456, abcdef, 000001
#
# <direction>: publish (default), subscribe, or bidirectional
#
# Examples:

# Single-byte hash destinations
hash_1b_ff = sensors/light
hash_1b_fe = sensors/temperature
hash_1b_fd = sensors/pressure:subscribe

# Two-byte hash destinations
hash_2b_abcd = mesh/broadcast:bidirectional
hash_2b_1234 = mesh/alerts
hash_2b_5678 = mesh/commands:subscribe

# Three-byte hash destinations
hash_3b_123456 = mesh/node1/data
hash_3b_abcdef = mesh/node2/control:bidirectional
